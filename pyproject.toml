[project]
name = "labops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ben Lavi", email = "benlavi7496@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "uvicorn>=0.52.3",
]

[project.scripts]
labops = "labops.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
