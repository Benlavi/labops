name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v9
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -v