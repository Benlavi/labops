name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
     
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
     
      - name: Install dependencies
        run: uv sync --frozen
     
      - name: Run tests
        run: uv run pytest -v
     
      - name: Validate compose configuration
        run: docker compose config -q
     
      - name: Build Docker image
        run: docker compose build labops-server 
     
      - name: Run Docker container
        run: docker compose up -d labops-server
     
      - name: Smoke test API
        run: |
          echo "Waiting for the server to be ready..."
          curl --fail --retry 7 --retry-delay 2 --retry-all-errors http://localhost:8000/reports 
      
      - name: Show docker logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color labops-server

      - name: Stop Docker services
        if: always()
        run: docker compose down

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tag Docker image
        if: github.event_name == 'push'
        run: docker tag labops-server:latest ghcr.io/benlavi/labops:latest

      - name: push Docker image
        if: github.event_name == 'push'
        run: docker push ghcr.io/benlavi/labops:latest